# TruthFrame / Rennaigan — detector configuration
# Update temperatures and thresholds after calibration on your own samples.
# Record weights SHA-256 for the audit chain.

preprocessing:
  frame_sample_fps: 3
  motion_fps: 25
  max_clip_length_sec: 60
  audio_sample_rate: 16000
  max_upload_mb: 100

face_detection:
  model: buffalo_l
  det_size: [640, 640]
  det_thresh: 0.5
  min_face_px: 64
  crop_margin: 1.3
  batch_size: 32  # drop to 16 on 8GB GPUs

thresholds:
  sbi: 0.5
  univfd: 0.5
  trufor: 0.5
  sbi_video_high: 0.6   # hysteresis on
  sbi_video_low: 0.4    # hysteresis off
  lipforensics: 0.5
  syncnet_confidence: 3.0
  syncnet_offset_frames: 3
  ssl_aasist: 0.5
  ecapa_similarity: 0.25
  identity_drift: 0.35
  head_pose_deg: 10.0
  flow_jitter_zscore: 3.0
  blink_no_blink_sec: 20.0

temperatures:
  image: 1.0
  video: 1.0
  audio: 1.0
  motion: 1.0
  metadata: 1.0

module_weights:
  public:
    image: 0.35
    audio: 0.25
    motion: 0.15
    video: 0.15
    metadata: 0.10
  identity:
    image: 0.25
    audio: 0.10
    motion: 0.20
    video: 0.35
    metadata: 0.10

fusion:
  strong_signal_cap: 0.9
  strong_signal_max_trust: 30
  inconclusive_coverage_threshold: 0.5

labels:
  low_risk: [70, 100]
  review: [40, 69]
  high_manipulation: [0, 39]

weights_sha256:
  sbi: "REPLACE_AFTER_DOWNLOAD"
  univfd: "REPLACE_AFTER_DOWNLOAD"
  trufor: "REPLACE_AFTER_DOWNLOAD"
  lipforensics: "REPLACE_AFTER_DOWNLOAD"
  syncnet: "REPLACE_AFTER_DOWNLOAD"
  ssl_aasist: "REPLACE_AFTER_DOWNLOAD"
  xlsr_300m: "REPLACE_AFTER_DOWNLOAD"
